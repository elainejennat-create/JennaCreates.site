<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 245 255"
  width="245" height="255"
  role="img" aria-hidden="true">
  <style>
    .piece {
      fill: #490f16;
      transform-box: fill-box;
      transform-origin: center;
    }
    
        .main {
          animation: pulse 2.8s ease-in-out infinite;
        }
        .dot {
          animation: twinkle 2.2s ease-in-out infinite;
        }
        .p2 { animation-delay: .2s; }
        .p3 { animation-delay: .55s; }
        .p4 { animation-delay: .85s; }
        .p5 { animation-delay: 1.1s; }

        @keyframes pulse {
          0%,100% { transform: scale(1) rotate(0deg); opacity: .92; }
          50% { transform: scale(1.07) rotate(2deg); opacity: 1; }
        }

        @keyframes twinkle {
          0%,100% { transform: scale(.78); opacity: .35; }
          50% { transform: scale(1.18); opacity: 1; }
        }
        
    @media (prefers-reduced-motion: reduce) {
      .piece { animation: none !important; }
    }
  </style>
