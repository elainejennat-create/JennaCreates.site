<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 295 290"
  width="295" height="290"
  role="img" aria-hidden="true">
  <style>
    .piece {
      fill: #490f16;
      transform-box: fill-box;
      transform-origin: center;
    }
    
        .main {
          animation: wiggle 3.4s ease-in-out infinite;
        }
        .dot {
          animation: twinkle 2.15s ease-in-out infinite;
        }
        .p2 { animation-delay: .15s; }
        .p3 { animation-delay: .4s; }
        .p4 { animation-delay: .7s; }
        .p5 { animation-delay: .95s; }
        .p6 { animation-delay: 1.2s; }

        @keyframes wiggle {
          0%,100% { transform: rotate(-1deg) scale(1); }
          50% { transform: rotate(2.5deg) scale(1.035); }
        }

        @keyframes twinkle {
          0%,100% { transform: scale(.72) rotate(-6deg); opacity: .3; }
          50% { transform: scale(1.18) rotate(7deg); opacity: 1; }
        }
        
    @media (prefers-reduced-motion: reduce) {
      .piece { animation: none !important; }
    }
  </style>
